name: DropDial CI/CD

on:
  push:
    branches: [ main, advance-features ]
    tags: [ 'v*', '[0-9]+.*' ]
  pull_request:
    branches: [ main, advance-features ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS Build & Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python3 -m pip install pillow

      - name: Verify Python backend integrity
        run: |
          python3 work/test-i18n.py
          python3 -m py_compile work/DropDial/backend/*.py

      - name: Build macOS application bundle
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^[0-9] ]]; then
            TAG="1.0.2.4"
          fi
          ./build-mac.sh "$TAG"

      - name: Verify macOS app bundle & binaries
        run: |
          APP_PATH="outputs/DropDial-macOS/DropDial.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: $APP_PATH was not created!" && exit 1
          fi

          echo "Checking Info.plist..."
          plutil -lint "$APP_PATH/Contents/Info.plist"

          echo "Checking main executable..."
          MAIN_BIN="$APP_PATH/Contents/MacOS/DropDial"
          if [ ! -x "$MAIN_BIN" ]; then
            echo "Error: $MAIN_BIN is missing or not executable!" && exit 1
          fi
          file "$MAIN_BIN"

          echo "Checking helper binaries..."
          OCR_BIN="$APP_PATH/Contents/backend/ocr-mac"
          DOC_BIN="$APP_PATH/Contents/backend/doc2pdf-mac"
          if [ ! -x "$OCR_BIN" ] || [ ! -x "$DOC_BIN" ]; then
            echo "Error: Helper binaries are missing or not executable!" && exit 1
          fi
          "$OCR_BIN" 2>&1 | grep -q "Usage: ocr-mac"
          "$DOC_BIN" 2>&1 | grep -q "Usage: doc2pdf-mac"
          echo "All macOS binaries verified successfully!"

      - name: Package macOS application
        run: |
          mkdir -p outputs/DropDial-macOS
          ditto -c -k --sequesterRsrc --keepParent outputs/DropDial-macOS/DropDial.app outputs/DropDial-macOS/DropDial-macOS.zip
          cp outputs/DropDial-macOS/DropDial-macOS.zip outputs/DropDial-macOS.zip 2>/dev/null || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropDial-macOS
          path: |
            outputs/DropDial-macOS/DropDial-macOS.zip
            outputs/DropDial-macOS/DropDial.dmg
          if-no-files-found: warn

  windows:
    name: Windows Build & Checks
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r requirements-runtime.txt

      - name: Verify Python backend syntax
        shell: pwsh
        run: |
          python -m py_compile (Get-ChildItem work/DropDial/backend/*.py).FullName
          python work/test-i18n.py

      - name: Prepare Windows runtime binaries
        shell: pwsh
        run: python work/prepare-runtime.py

      - name: Build Windows application
        shell: pwsh
        run: |
          dotnet --info
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v?\d') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.2.4" }
          ./build.ps1 -Version $tag

      - name: Verify Windows executable & runtime
        shell: pwsh
        run: |
          $exePath = "outputs/DropDial/DropDial.exe"
          if (-not (Test-Path $exePath)) {
            throw "Error: $exePath was not generated."
          }
          $pyPath = "outputs/DropDial/runtime/python/python.exe"
          if (-not (Test-Path $pyPath)) {
            throw "Error: $pyPath was not generated."
          }
          $ffmpegPath = "outputs/DropDial/runtime/ffmpeg/ffmpeg.exe"
          if (-not (Test-Path $ffmpegPath)) {
            throw "Error: $ffmpegPath was not generated."
          }
          Write-Host "Verified Windows binary and runtime: $exePath"

      - name: Run Windows UI & parameter checks
        shell: pwsh
        run: |
          dotnet run --project work/F9Checks -- outputs/f9-parameter-tests.json
          if ($LASTEXITCODE -ne 0) { throw 'Tool parameter checks failed.' }
          dotnet run --project work/ProgressChecks -- outputs/progress-ui-tests.json
          if ($LASTEXITCODE -ne 0) { throw 'Progress lifecycle checks failed.' }
          dotnet run --project work/UiControlsChecks -- outputs/ui-controls
          if ($LASTEXITCODE -ne 0) { throw 'Selection and slider controls failed.' }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisDir) {
            echo "$nsisDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Package Windows binaries
        shell: pwsh
        run: |
          # 1. Full standalone offline package (includes runtime, ~250 MB)
          Compress-Archive -Path outputs/DropDial -DestinationPath outputs/DropDial-Windows-x64.zip -Force

          # 2. Ultra-lightweight app update package (~2 MB instead of 70 MB)
          $updateStage = "outputs/DropDial-Update"
          if (Test-Path $updateStage) { Remove-Item -Path $updateStage -Recurse -Force }
          New-Item -ItemType Directory -Path $updateStage -Force | Out-Null

          Copy-Item -LiteralPath "outputs/DropDial/DropDial.exe" -Destination $updateStage -Force
          Get-ChildItem -Path "outputs/DropDial" -Filter "*.dll" | Copy-Item -Destination $updateStage -Force
          Copy-Item -LiteralPath "outputs/DropDial/DropDial.deps.json" -Destination $updateStage -Force
          Copy-Item -LiteralPath "outputs/DropDial/DropDial.runtimeconfig.json" -Destination $updateStage -Force
          Copy-Item -Path "outputs/DropDial/backend" -Destination $updateStage -Recurse -Force
          Get-ChildItem -Path "outputs/DropDial" -Filter "*.md" | Copy-Item -Destination $updateStage -Force
          Get-ChildItem -Path "outputs/DropDial" -Filter "*.txt" | Copy-Item -Destination $updateStage -Force
          Get-ChildItem -Path "outputs/DropDial" -Filter "*.json" | Copy-Item -Destination $updateStage -Force
          if (Test-Path "outputs/DropDial/validation") {
            Copy-Item -Path "outputs/DropDial/validation" -Destination $updateStage -Recurse -Force
          }

          Compress-Archive -Path "$updateStage/*" -DestinationPath outputs/DropDial-Windows-Update.zip -Force
          Remove-Item -Path $updateStage -Recurse -Force

          Copy-Item -LiteralPath outputs/DropDial/DropDial.exe -Destination outputs/DropDial.exe -Force

          # 3. Build standalone NSIS installer DropDial-Setup.exe
          $sourceDir = (Resolve-Path "outputs/DropDial").Path
          $sourceFiles = Join-Path $sourceDir "*.*"
          Write-Host "NSIS source directory: $sourceDir"
          Write-Host "NSIS source files: $sourceFiles"
          New-Item -ItemType Directory -Path "website/downloads" -Force | Out-Null
          New-Item -ItemType Directory -Path "outputs" -Force | Out-Null

          $appVer = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v?\d') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.2.4" }
          $nsisCmd = if (Get-Command makensis -ErrorAction SilentlyContinue) { "makensis" }
                     elseif (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") { "C:\Program Files (x86)\NSIS\makensis.exe" }
                     elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") { "C:\Program Files\NSIS\makensis.exe" }
                     else { throw "makensis executable not found!" }

          & $nsisCmd "/DSOURCE_FILES=$sourceFiles" "/DAPP_VERSION=$appVer" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

          if (Test-Path "website/downloads/DropDial-Setup.exe") {
            Copy-Item -LiteralPath "website/downloads/DropDial-Setup.exe" -Destination "outputs/DropDial-Setup.exe" -Force
          } elseif (Test-Path "outputs/DropDial-Setup.exe") {
            Copy-Item -LiteralPath "outputs/DropDial-Setup.exe" -Destination "website/downloads/DropDial-Setup.exe" -Force
          } else {
            throw "Error: DropDial-Setup.exe was not created."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropDial-Windows-x64
          path: |
            outputs/DropDial-Windows-x64.zip
            outputs/DropDial-Windows-Update.zip
            outputs/DropDial.exe
            outputs/DropDial-Setup.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: DropDial-macOS
          path: release_assets/mac

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: DropDial-Windows-x64
          path: release_assets/win

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release_assets/ -type f
          NOTES_FILE=""
          TAG="${{ github.ref_name }}"
          CLEAN_TAG="${TAG#v}"
          if [ -f "release/${CLEAN_TAG}.md" ]; then
            NOTES_FILE="release/${CLEAN_TAG}.md"
          elif [ -f "docs/releases/${CLEAN_TAG}.md" ]; then
            NOTES_FILE="docs/releases/${CLEAN_TAG}.md"
          fi

          # Ensure release is created or updated
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release metadata..."
            if [ -n "$NOTES_FILE" ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE" --title "DropDial $TAG" --draft=false --latest || true
            else
              gh release edit "$TAG" --draft=false --latest || true
            fi
          else
            echo "Creating release $TAG..."
            if [ -n "$NOTES_FILE" ]; then
              gh release create "$TAG" --notes-file "$NOTES_FILE" --title "DropDial $TAG" --draft=false --latest
            else
              gh release create "$TAG" --generate-notes --title "DropDial $TAG" --draft=false --latest
            fi
          fi

          # Upload each asset individually to avoid shell word-splitting or newline issues
          echo "Uploading release assets..."
          find release_assets/ -type f -exec gh release upload "$TAG" {} --clobber \;
